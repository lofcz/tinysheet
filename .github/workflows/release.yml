name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun.lock uses lockfileVersion 2 (Bun canary); stable 1.3.x cannot parse it.
          bun-version: canary

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test:formula-parser

      - name: Build
        run: bun run build

      - name: Bump package versions
        id: version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(version, type) {
            const [major, minor, patch] = version.split(".").map(Number);
            if (type === "major") return `${major + 1}.0.0`;
            if (type === "minor") return `${major}.${minor + 1}.0`;
            return `${major}.${minor}.${patch + 1}`;
          }

          const type = process.env.RELEASE_TYPE;
          const pkgs = [
            {
              path: "packages/core/package.json",
              name: "@lofcz/tinysheet-core",
              deps: [],
            },
            {
              path: "packages/react/package.json",
              name: "@lofcz/tinysheet-react",
              deps: ["@lofcz/tinysheet-core"],
            },
            {
              path: "packages/excel/package.json",
              name: "@lofcz/tinysheet-excel",
              deps: ["@lofcz/tinysheet-core"],
            },
          ];

          const core = JSON.parse(fs.readFileSync(pkgs[0].path, "utf8"));
          const version = bumpVersion(core.version, type);

          for (const pkg of pkgs) {
            const json = JSON.parse(fs.readFileSync(pkg.path, "utf8"));
            json.version = version;
            for (const dep of pkg.deps) {
              if (json.dependencies?.[dep]) {
                json.dependencies[dep] = `^${version}`;
              }
            }
            fs.writeFileSync(pkg.path, `${JSON.stringify(json, null, 2)}\n`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(
            `Bumped @lofcz/tinysheet-{core,react,excel} to ${version}`
          );
          EOF

      - name: Commit release version and create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/core/package.json packages/react/package.json packages/excel/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          publish_if_new() {
            local dir="$1"
            local name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on registry)"
            else
              echo "publish $name@$version"
              (cd "$dir" && npm publish --provenance --access public)
            fi
          }
          publish_if_new packages/formula-parser
          publish_if_new packages/core
          publish_if_new packages/react
          publish_if_new packages/excel

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
