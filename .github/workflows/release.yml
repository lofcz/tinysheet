name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Bump package versions
        id: version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(version, type) {
            const [major, minor, patch] = version.split(".").map(Number);
            if (type === "major") return `${major + 1}.0.0`;
            if (type === "minor") return `${major}.${minor + 1}.0`;
            return `${major}.${minor}.${patch + 1}`;
          }

          const type = process.env.RELEASE_TYPE;
          const corePath = "packages/core/package.json";
          const reactPath = "packages/react/package.json";

          const core = JSON.parse(fs.readFileSync(corePath, "utf8"));
          const version = bumpVersion(core.version, type);
          core.version = version;
          fs.writeFileSync(corePath, `${JSON.stringify(core, null, 2)}\n`);

          const react = JSON.parse(fs.readFileSync(reactPath, "utf8"));
          react.version = version;
          if (react.dependencies?.["@lofcz/prospera-sheet-core"]) {
            react.dependencies["@lofcz/prospera-sheet-core"] = `^${version}`;
          }
          fs.writeFileSync(reactPath, `${JSON.stringify(react, null, 2)}\n`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Bumped @lofcz/prospera-sheet-core and @lofcz/prospera-sheet-react to ${version}`);
          EOF

      - name: Commit release version and create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/core/package.json packages/react/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Publish @lofcz/prospera-sheet-core
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Publish @lofcz/prospera-sheet-react
        working-directory: packages/react
        run: npm publish --provenance --access public

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
