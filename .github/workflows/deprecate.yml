name: Deprecate old package names

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: Deprecate @lofcz/prospera-sheet-*
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          MSG='Package renamed to @lofcz/tinysheet-*. Use @lofcz/tinysheet-core / @lofcz/tinysheet-react / @lofcz/tinysheet-excel.'
          npm deprecate @lofcz/prospera-sheet-core "$MSG" || true
          npm deprecate @lofcz/prospera-sheet-react "$MSG" || true
          npm deprecate @lofcz/prospera-sheet-excel "$MSG" || true
