name: pages

# Demo at https://<owner>.github.io/<repo>/, docs at .../docs/
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Demo
        run: DEMO_BASE=$BASE bun run demo:build
      - name: Docs
        run: DOCS_BASE=${BASE}docs/ bun run docs:build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo/dist/. _site/
          cp -r docs/dist _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
